- id: __defaults__
  port: 2222
  ssh_options:
    - "-o StrictHostKeyChecking=no"

- id: host1
  user: alice
  host: 10.0.0.1
  auth:
    key: ~/.ssh/id_rsa

- id: host2
  user: bob
  host: 10.0.0.2
  port: 2200
  auth:
    pass: secret

- id: hostjump
  user: carol
  host: 10.0.0.3
  auth:
    key: ~/.ssh/id_rsa
  jump:
    - user: juser
      host: jump.example.com
      auth:
        pass: jpass

- id: hostmulti
  user: dave
  host: 10.0.0.4
  auth:
    key: ~/.ssh/id_rsa
  jump:
    - user: j1
      host: jump1.example.com
      port: 2201
      auth:
        key: ~/.ssh/j1
    - user: j2
      host: jump2.example.com
      auth:
        pass: j2pass
